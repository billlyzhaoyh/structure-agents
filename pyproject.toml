[project]
name = "structure-agents-workspace"
version = "0.1.0"
description = "Development workspace for the StructAgent research demo."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pytest==8.4.2",
  "ruff==0.12.12",
]
m3 = [
  "modal==1.5.5",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
