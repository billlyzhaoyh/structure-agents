[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "structagent-api"
version = "0.1.0"
description = "Trusted API control plane for the StructAgent research demo."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Tony Kwok" },
  { name = "Billy Zhao" },
]
dependencies = [
  "daytona==0.207.0",
  "duckdb==1.5.5",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "sqlglot==30.17.0",
  "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/structagent_api"]
